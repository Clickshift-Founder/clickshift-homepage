# clickshift.io on the DigitalOcean server (the one that runs Kobocent and QuantumHire).
# Copy to /etc/nginx/sites-available/clickshift.io and symlink into sites-enabled (docs/DEPLOY.md).
#
# - The app listens on 127.0.0.1:3100 only (npm run start:prod). Never open 3100 in ufw.
# - Traffic arrives only through Cloudflare (orange cloud); ufw allows 80/443 from Cloudflare's ranges only.
# - The visitor's real IP comes from the server-wide Cloudflare real-IP config (scripts/cloudflare-realip.sh in the
#   Kobocent repo). We overwrite X-Real-IP / X-Forwarded-For so a visitor can't forge them.
# - TLS: a Cloudflare Origin Certificate for clickshift.io and *.clickshift.io (Cloudflare → SSL/TLS → Origin Server),
#   saved as below, with Cloudflare SSL mode "Full (strict)".

server {
    listen 80;
    listen [::]:80;
    server_name clickshift.io www.clickshift.io;
    return 301 https://clickshift.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.clickshift.io;
    ssl_certificate     /etc/ssl/cloudflare/clickshift.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/clickshift.io.key;
    return 301 https://clickshift.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clickshift.io;

    ssl_certificate     /etc/ssl/cloudflare/clickshift.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/clickshift.io.key;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
